---
name: Code Style
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lint YAML
        uses: ibiqlik/action-yamllint@v3.1.1
      - name: lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
