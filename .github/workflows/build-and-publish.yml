---
name: Build and Publish Images
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 30 5 * * 3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-publish:
    name: >
      Build and Publish ${{ matrix.os }}
      ${{ matrix.codename }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian
            codename: bookworm
            version: 12
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - os: debian
            codename: trixie
            version: 13
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - os: ubuntu
            codename: jammy
            version: 22.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - os: ubuntu
            codename: noble
            version: 24.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - os: ubuntu
            codename: resolute
            version: 26.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64
    steps:
      - name: install QEMU
        uses: docker/setup-qemu-action@v4
      - name: install buildx
        uses: docker/setup-buildx-action@v4
      - name: build image for smoke test
        uses: docker/build-push-action@v7
        with:
          load: true
          context: "{{defaultContext}}:${{ matrix.os }}/${{ matrix.codename }}"
          platforms: linux/amd64
          tags: local/${{ matrix.os }}-systemd:${{ matrix.codename }}
      - name: smoke test systemd
        env:
          CONTAINER: systemd-smoke-${{ matrix.os }}-${{ matrix.codename }}
          IMAGE: local/${{ matrix.os }}-systemd:${{ matrix.codename }}
        run: |
          docker run --detach \
          --name "${CONTAINER}" \
          --privileged \
          --cgroupns=host \
          --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
          "${IMAGE}"
          trap 'docker rm --force "${CONTAINER}"' EXIT
          system_state="$(docker exec "${CONTAINER}" \
          systemctl is-system-running --wait)"
          test "${system_state}" = "running"
      - name: login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: srv6d
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: publish multi-platform image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          push: true
          context: "{{defaultContext}}:${{ matrix.os }}/${{ matrix.codename }}"
          tags: |
            srv6d/${{ matrix.os }}-systemd:${{ matrix.codename }}
            srv6d/${{ matrix.os }}-systemd:${{ matrix.version }}
          platforms: ${{ matrix.platforms }}
